<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Communities - আমাদের কমিউনিটি</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .tagline {
            font-size: 1.1em;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            font-weight: 600;
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }

        .communities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .community-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .community-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .community-card:hover::before {
            left: 100%;
        }

        .community-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .card-icon {
            font-size: 2.5em;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .card-category {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-description {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .card-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .card-link:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            color: white;
            font-size: 2em;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(255,255,255,0.3);
            font-weight: 700;
        }

        .no-results {
            text-align: center;
            color: white;
            padding: 50px;
            font-size: 1.1em;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 60px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2em;
            }

            .communities-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .filter-tabs {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 15px;
                font-size: 0.85em;
            }
        }
    </style>
</head>

        function renderCommunities(filter = 'all') {
            const content = document.getElementById('content');
            let html = '';

            if (filter === 'all') {
                // Show by category
                const categories = {
                    'national': { title: '🌍 জাতীয় কমিউনিটি', emoji: '🌍' },
                    'dhaka': { title: '🏙️ ঢাকা কমিউনিটি', emoji: '🏙️' },
                    'education': { title: '🎓 শিক্ষা ও দক্ষতা', emoji: '🎓' },
                    'skills': { title: '💼 পেশাদার দক্ষতা', emoji: '💼' },
                    'food': { title: '🍲 খাদ্য ব্যাংক নেটওয়ার্ক', emoji: '🍲' },
                    'tuition': { title: '📚 টিউশন সার্ভিস কমিউনিটি', emoji: '📚' }
                };

                for (const [key, category] of Object.entries(categories)) {
                    if (communities[key] && communities[key].length > 0) {
                        html += `<div class="category-section">
                            <h2 class="category-title">${category.title}</h2>
                            <div class="communities-grid">`;
                        
                        communities[key].forEach(comm => {
                            html += createCard(comm);
                        });
                        
                        html += `</div></div>`;
                    }
                }
            } else {
                // Show filtered category
                if (communities[filter] && communities[filter].length > 0) {
                    html = `<div class="communities-grid">`;
                    communities[filter].forEach(comm => {
                        html += createCard(comm);
                    });
                    html += `</div>`;
                } else {
                    html = '<div class="no-results">কোন ফলাফল পাওয়া যায়নি। অনুগ্রহ করে অন্য কিছু চেষ্টা করুন।</div>';
                }
            }

            content.innerHTML = html;
        }

        function createCard(comm) {
            return `
                <div class="community-card">
                    <div class="card-icon">${comm.icon}</div>
                    <div class="card-title">${comm.name}</div>
                    <div class="card-category">${comm.desc}</div>
                    <div class="card-description">এই সম্প্রদায়ের সাথে যোগ দিন এবং সংযুক্ত থাকুন</div>
                    <a href="${comm.url}" target="_blank" class="card-link">ভিজিট করুন →</a>
                </div>
            `;
        }

        function filterCategory(category) {
            currentFilter = category;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderCommunities(category);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const content = document.getElementById('content');
            
            if (searchTerm.length === 0) {
                renderCommunities('all');
                return;
            }

            const filtered = allCommunities.filter(comm => 
                comm.name.toLowerCase().includes(searchTerm) ||
                comm.desc.toLowerCase().includes(searchTerm)
            );

            if (filtered.length > 0) {
                let html = '<div class="communities-grid">';
                filtered.forEach(comm => {
                    html += createCard(comm);
                });
                html += '</div>';
                content.innerHTML = html;
            } else {
                content.innerHTML = '<div class="no-results">😔 কোন কমিউনিটি পাওয়া যায়নি। অন্য শব্দ চেষ্টা করুন।</div>';
            }
        });

        // Initial render
        renderCommunities('all');
